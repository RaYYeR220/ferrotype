# Ferrotype gas bench. One profile, no dependencies beyond forge itself.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
auto_detect_remappings = false

# Every contract compiles with the optimizer on at 200 runs. The solc version comes from each
# wrapper's exact pragma: 0.8.38 for the Bedrock libraries and the 0.8 port of Lido's verifier,
# 0.6.12 for Lido's verifier as audited and deployed.
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "osaka"

remappings = [
  # Bedrock files import each other as "src/libraries/...". This bench has no src/libraries, so
  # point that prefix at the vendored tree and the files stay byte-identical to upstream.
  "src/libraries/=vendor/optimism/src/libraries/",
  "@optimism/=vendor/optimism/src/",
  # Lido's files import Solidity-RLP by its brownie package path.
  "hamdiallam/Solidity-RLP@2.0.5/=vendor/solidity-rlp/",
  "@lido/=vendor/lido/contracts/",
  "@lido-0.8/=vendor/curve-port/contracts/",
]

fs_permissions = [
  { access = "read", path = "../fixtures" },
  { access = "read", path = "../out" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./results" },
]

[lint]
# forge's linter cannot read the 0.6.12 AST and only adds noise to a bench run.
lint_on_build = false
